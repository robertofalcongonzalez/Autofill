<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Form Autofill test form</title>
  <style>
    body { font: 16px system-ui; max-width: 760px; margin: 30px auto; padding: 0 18px; color: #172033; }
    form, section { display: grid; gap: 12px; border: 1px solid #ccd2df; padding: 18px; border-radius: 10px; margin: 18px 0; }
    label { display: grid; gap: 4px; } input, select, textarea { padding: 8px; font: inherit; }
  </style>
</head>
<body>
  <h1>Autofill fixture</h1>
  <p>This page is never submitted. It covers standard, multilingual, existing, disabled, hidden, select, textarea, and dynamic controls.</p>
  <form onsubmit="event.preventDefault()">
    <label>Full name <input autocomplete="name"></label>
    <label>First name <input autocomplete="section-main given-name"></label>
    <label>Apellido <input name="apellido"></label>
    <label>Correo electrónico <input type="email" aria-label="Correo electrónico"></label>
    <label>Telefone <input type="tel" name="telefone"></label>
    <label>Empresa <input name="empresa"></label>
    <label>Endereço <textarea autocomplete="shipping street-address"></textarea></label>
    <label>Complemento <input name="complemento"></label>
    <label>Cidade <input name="cidade"></label>
    <label>Província <input name="provincia"></label>
    <label>CEP <input name="cep"></label>
    <label>Country
      <select autocomplete="country-name"><option value="">Choose</option><option value="BR">Brazil</option><option value="PT">Portugal</option><option value="ES">Spain</option></select>
    </label>
    <label>Existing email (preserved by default) <input autocomplete="email" value="keep-me@example.test"></label>
    <label>Disabled city <input autocomplete="address-level2" disabled></label>
    <input type="hidden" autocomplete="email">
    <label>Password <input type="password" autocomplete="current-password"></label>
    <label>Search <input type="search" name="search"></label>
  </form>
  <button id="add">Add a dynamic postal-code field</button>
  <section id="dynamic"><strong>Dynamic fields appear here</strong></section>
  <p><a href="/controlled.html">Open controlled-input fixture</a></p>
  <script>
    document.querySelector('#add').addEventListener('click', () => {
      const label = document.createElement('label'); label.textContent = 'Código postal (dynamic)'
      const input = document.createElement('input'); input.autocomplete = 'postal-code'
      label.append(input); document.querySelector('#dynamic').append(label)
    })
  </script>
</body>
</html>
